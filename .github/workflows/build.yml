# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9a-zA-Z]+"

  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        # Use these Java versions
        java: [
          25,    # Minimum supported by Minecraft 26.x
        ]
        # and run on both Linux and Windows
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: validate gradle wrapper
        uses: gradle/wrapper-validation-action@v3
      - name: setup jdk ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
      - name: make gradle wrapper executable
        if: ${{ runner.os != 'Windows' }}
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: verify generated data is up to date
        if: ${{ runner.os == 'Linux' }}
        run: |
          ./gradlew runDatagen
          if [ -n "$(git status --porcelain -- src/main/generated)" ]; then
            echo "::error::Generated data is out of date. Run './gradlew runDatagen' and commit src/main/generated."
            git status --porcelain -- src/main/generated
            exit 1
          fi
      - name: capture build artifacts
        if: ${{ runner.os == 'Linux' && matrix.java == '25' }} # Only upload artifacts built from latest java on one OS
        uses: actions/upload-artifact@v4
        with:
          name: Artifacts
          path: build/libs/
